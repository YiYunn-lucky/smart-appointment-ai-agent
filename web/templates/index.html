<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安居家电 · 售后智能客服</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 20px 30px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .header-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        .nav-bar {
            background: rgba(255,255,255,0.98);
            padding: 15px 30px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .nav-btn {
            padding: 8px 16px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
        }

        .chat-content {
            flex: 1;
            padding: 20px 30px;
            overflow-y: auto;
            background: linear-gradient(to bottom, rgba(255,255,255,0.9), rgba(248,250,252,0.9));
            scroll-behavior: smooth;
        }

        .chat-content::-webkit-scrollbar {
            width: 6px;
        }

        .chat-content::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
            border-radius: 3px;
        }

        .chat-content::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 3px;
        }

        .message {
            display: flex;
            margin-bottom: 20px;
            align-items: flex-end;
            animation: messageSlide 0.3s ease;
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            margin: 0 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .message.bot .avatar {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
        }

        .bubble {
            max-width: 75%;
            padding: 15px 20px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.5;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .message.user .bubble {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message.bot .bubble {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            color: #2c3e50;
            border-bottom-left-radius: 5px;
            border: 2px solid rgba(79, 172, 254, 0.2);
            font-weight: 500;
        }

        /* 机器人回复中的特殊文本样式 */
        .bot-reply {
            color: #2c3e50;
            font-weight: 600;
        }

        .bot-thought {
            color: #7f8c8d;
            font-style: italic;
            font-size: 14px;
            opacity: 0.8;
        }

        .bot-success {
            color: #27ae60;
            font-weight: 700;
            background: linear-gradient(135deg, #d5f4e6 0%, #e8f8f5 100%);
            padding: 10px 15px;
            border-radius: 10px;
            margin: 5px 0;
            border-left: 4px solid #27ae60;
        }

        .bot-error {
            color: #e74c3c;
            font-weight: 600;
            background: linear-gradient(135deg, #fadbd8 0%, #f2d7d5 100%);
            padding: 10px 15px;
            border-radius: 10px;
            margin: 5px 0;
            border-left: 4px solid #e74c3c;
        }

        .bot-info {
            color: #3498db;
            font-weight: 600;
            background: linear-gradient(135deg, #d6eaf8 0%, #eaf4fd 100%);
            padding: 10px 15px;
            border-radius: 10px;
            margin: 5px 0;
            border-left: 4px solid #3498db;
        }

        .input-area {
            padding: 20px 30px;
            background: rgba(255,255,255,0.95);
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        #chat-form {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        #user-input {
            flex: 1;
            padding: 15px 20px;
            border-radius: 25px;
            border: 2px solid rgba(0,0,0,0.1);
            font-size: 15px;
            background: white;
            transition: all 0.3s ease;
            outline: none;
            resize: none;
            max-height: 120px;
            overflow-y: auto;
        }

        #user-input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        #user-input::placeholder {
            color: #999;
            opacity: 1;
        }

        #send-btn {
            padding: 15px 25px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.4);
        }

        #send-btn:active {
            transform: translateY(0);
        }

        .typing-indicator {
            display: none;
            padding: 15px 20px;
            background: white;
            border-radius: 20px;
            margin: 10px 0;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .typing-dots {
            display: inline-flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .chat-container {
                width: 100%;
                height: 100vh;
                border-radius: 15px;
            }

            .header, .nav-bar, .chat-content, .input-area {
                padding-left: 20px;
                padding-right: 20px;
            }

            .nav-bar {
                justify-content: flex-start;
                overflow-x: auto;
                padding-bottom: 20px;
            }

            .bubble {
                max-width: 85%;
            }

            .header-title {
                font-size: 20px;
            }

            .header-subtitle {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- 头部区域 -->
        <div class="header">
            <div class="header-title">
                <i class="fas fa-headset"></i>
                安居家电 · 售后智能客服
            </div>
            <div class="header-subtitle">
                报修登记 · 工程师上门预约 · 保修查询 · 售后咨询（服务时间 9:00 - 18:00）
            </div>
        </div>

        <!-- 导航栏 -->
        <div class="nav-bar">
            <a class="nav-btn" href="/tickets">
                <i class="fas fa-clipboard-list"></i>
                报修工单
            </a>
            <a class="nav-btn" href="/engineers">
                <i class="fas fa-users"></i>
                工程师管理
            </a>
            <a class="nav-btn" href="/engineer_schedules">
                <i class="fas fa-calendar-alt"></i>
                今日排班
            </a>
            <a class="nav-btn" href="/follow_ups">
                <i class="fas fa-phone-volume"></i>
                售后回访
            </a>
            <a class="nav-btn" href="/knowledge">
                <i class="fas fa-database"></i>
                知识库管理
            </a>
            <a class="nav-btn" id="clear-btn" href="javascript:void(0)">
                <i class="fas fa-trash-alt"></i>
                清空对话
            </a>
        </div>

        <!-- 聊天内容区域 -->
        <div class="chat-content" id="chat-box">
            <!-- 欢迎消息 -->
            <div class="message bot">
                <div class="avatar">
                    <i class="fas fa-headset"></i>
                </div>
                <div class="bubble">
                    <div class="bot-info">
                        👋 您好！欢迎来到安居家电售后服务中心！
                    </div>
                    <div class="bot-reply">
                        我可以帮您：<br>
                        • 🔧 登记家电故障报修，安排工程师上门<br>
                        • 📞 查询订单与保修状态（请提供手机号）<br>
                        • 📋 查询报修工单进度（报修单号 AX…）<br>
                        • ❓ 解答收费、故障排查等售后问题<br>
                        • 🤝 投诉与人工服务转接
                    </div>
                    <div class="bot-success">
                        请告诉我您需要什么帮助？
                    </div>
                </div>
            </div>
        </div>

        <!-- 打字指示器 -->
        <div class="typing-indicator" id="typing-indicator">
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <span style="margin-left: 10px; color: #666;">AI正在思考中...</span>
        </div>

        <!-- 输入区域 -->
        <div class="input-area">
            <form id="chat-form">
                <input type="text" id="user-input" placeholder="例如：空调不制冷，想报修上门…" autocomplete="off" required>
                <button id="send-btn" type="submit">
                    <i class="fas fa-paper-plane"></i>
                    发送
                </button>
            </form>
        </div>
    </div>
    <script>
    const chatBox = document.getElementById('chat-box');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const clearBtn = document.getElementById('clear-btn');
    const typingIndicator = document.getElementById('typing-indicator');
    let lastBotBubble = null;

    // 消息分段与样式关键词（与后端 [THOUGHT]/[REPLY]/[SIGNAL]/[ERROR] 令牌及成功文案保持同步）
    const SUCCESS_KEYWORDS = ['报修已登记成功', '已为您安排', '已登记转人工'];
    const ERROR_KEYWORDS = ['抱歉', '失败', '无法为您', '出现异常'];

    function addMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message ' + sender;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        if (sender === 'user') {
            avatar.innerHTML = '<i class="fas fa-user"></i>';
        } else {
            avatar.innerHTML = '<i class="fas fa-headset"></i>';
        }

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = text.replace(/\n/g, '<br>');

        msgDiv.appendChild(avatar);
        msgDiv.appendChild(bubble);
        chatBox.appendChild(msgDiv);

        // 平滑滚动到底部
        requestAnimationFrame(() => {
            chatBox.scrollTo({
                top: chatBox.scrollHeight,
                behavior: 'smooth'
            });
        });

        if (sender === 'bot') lastBotBubble = bubble;
    }

    function showTypingIndicator() {
        typingIndicator.style.display = 'block';
        requestAnimationFrame(() => {
            chatBox.scrollTo({
                top: chatBox.scrollHeight,
                behavior: 'smooth'
            });
        });
    }

    function hideTypingIndicator() {
        typingIndicator.style.display = 'none';
    }

    function styleReplyText(replyText) {
        // 优先命中成功/失败关键词，其次按问询特征走 info 样式
        if (SUCCESS_KEYWORDS.some(k => replyText.includes(k))) {
            return `<div class="bot-success">✅ ${replyText}</div>`;
        }
        if (ERROR_KEYWORDS.some(k => replyText.includes(k))) {
            return `<div class="bot-error">❌ ${replyText}</div>`;
        }
        if (replyText.includes('请问') || replyText.includes('麻烦') || replyText.includes('是否为您安排')) {
            return `<div class="bot-info">💬 ${replyText}</div>`;
        }
        return `<div class="bot-reply">${replyText}</div>`;
    }

    function updateLastBotMessage(text) {
        if (!lastBotBubble) return;
        // 按 [THOUGHT]/[REPLY]/[ERROR] 令牌分段渲染；[SIGNAL] 令牌不展示
        const pattern = /\[(THOUGHT|REPLY|ERROR)[^\]]*\]/g;
        let result = [];
        let lastIndex = 0;
        let match;
        while ((match = pattern.exec(text)) !== null) {
            // 忽略两令牌之间的散落内容（如 [SIGNAL] 行）
            lastIndex = match.index + match[0].length;
            const content = match[0];
            const tokenType = match[1];
            const nextToken = pattern.exec(text);
            const endIndex = nextToken ? nextToken.index : text.length;
            pattern.lastIndex = endIndex; // 让外层循环正确跳过已消费段
            let sectionText = text.substring(lastIndex, endIndex).trim().replace(/\n/g, '<br>');
            lastIndex = endIndex;
            if (!sectionText) continue;
            if (tokenType === 'THOUGHT') {
                result.push(`<div class="bot-thought">${sectionText}</div>`);
            } else if (tokenType === 'ERROR') {
                result.push(`<div class="bot-error">⚠️ ${sectionText}</div>`);
            } else {
                result.push(styleReplyText(sectionText));
            }
            lastIndex = endIndex;
        }
        if (result.length === 0) {
            // 无任何令牌（纯错误返回等），原样渲染
            const plain = text.trim().replace(/\n/g, '<br>');
            result.push(plain ? `<div class="bot-error">${plain}</div>` : '');
        }
        lastBotBubble.innerHTML = result.join('');

        // 内容更新后自动滚动
        requestAnimationFrame(() => {
            chatBox.scrollTo({
                top: chatBox.scrollHeight,
                behavior: 'smooth'
            });
        });
    }

    chatForm.onsubmit = async function(e) {
        e.preventDefault();
        const text = userInput.value.trim();
        if (!text) return;

        // 禁用发送按钮
        const sendBtn = document.getElementById('send-btn');
        sendBtn.disabled = true;
        sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 发送中...';

        addMessage(text, 'user');
        userInput.value = '';

        // 显示打字指示器
        showTypingIndicator();

        // 添加空的机器人消息
        addMessage('', 'bot');
        lastBotBubble = chatBox.querySelector('.message.bot:last-child .bubble');

        try {
            const res = await fetch('/chat/stream', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: text})
            });

            hideTypingIndicator();

            const reader = res.body.getReader();
            let botMsg = '';
            let decoder = new TextDecoder();

            while (true) {
                const {done, value} = await reader.read();
                if (done) break;
                botMsg += decoder.decode(value, {stream: true});
                updateLastBotMessage(botMsg);
            }
        } catch (error) {
            hideTypingIndicator();
            lastBotBubble.innerHTML = '抱歉，服务暂时不可用，请稍后再试。';
            console.error('Chat error:', error);
        } finally {
            // 恢复发送按钮
            sendBtn.disabled = false;
            sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> 发送';
            userInput.focus();
        }
    }

    clearBtn.onclick = function() {
        // 保留欢迎消息，只清除其他对话
        const welcomeMessage = chatBox.querySelector('.message.bot').cloneNode(true);
        chatBox.innerHTML = '';
        chatBox.appendChild(welcomeMessage);

        // 重新设置lastBotBubble为null
        lastBotBubble = null;

        // 聚焦输入框
        userInput.focus();
    }

    // 添加回车键发送功能
    userInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            chatForm.dispatchEvent(new Event('submit'));
        }
    });

    // 页面加载完成后聚焦输入框
    window.addEventListener('load', function() {
        userInput.focus();
    });
    </script>
</body>
</html>
