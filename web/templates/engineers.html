<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安居家电 · 工程师管理</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1100px; margin: 0 auto; background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px); border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden; border: 1px solid rgba(255,255,255,0.2);
        }
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 30px; color: white; text-align: center; position: relative; overflow: hidden;
        }
        .header h2 {
            font-size: 28px; font-weight: 600; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: center; gap: 15px;
        }
        .header p { font-size: 16px; opacity: 0.9; }
        .content { padding: 30px; }
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white; padding: 20px; border-radius: 15px; text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .stat-card i { font-size: 24px; margin-bottom: 10px; }
        .stat-card .number { font-size: 24px; font-weight: bold; margin-bottom: 5px; }
        .stat-card .label { font-size: 14px; opacity: 0.9; }
        .table-container {
            background: white; border-radius: 15px; overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1); margin-bottom: 30px;
        }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 20px 15px; text-align: center;
            font-weight: 600; font-size: 14px;
        }
        td {
            padding: 18px 15px; text-align: center; border-bottom: 1px solid rgba(0,0,0,0.05);
            font-size: 14px; vertical-align: middle;
        }
        tbody tr { transition: all 0.3s ease; }
        tbody tr:hover {
            background: linear-gradient(135deg, rgba(79,172,254,0.05), rgba(0,242,254,0.05));
            transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .skill-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
        .skill-chip {
            background: rgba(79,172,254,0.12); color: #2b6cb0;
            padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500;
            white-space: nowrap;
        }
        .region-badge {
            background: rgba(240,147,251,0.12); color: #9b59b6;
            padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500;
        }
        .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; display: inline-block; }
        .status-available { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; }
        .status-busy { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); color: white; }
        .busy-list { font-size: 12px; color: #555; line-height: 1.8; }
        .nav-btn {
            padding: 12px 30px; border-radius: 25px; border: none;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white; font-size: 16px; font-weight: 500; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 8px 25px rgba(79,172,254,0.3);
            display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
        }
        .nav-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(79,172,254,0.4); }
        .actions { text-align: center; margin-top: 20px; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .nav-btn.secondary { background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%); box-shadow: 0 8px 25px rgba(124,58,237,0.3); }
        .load-error { text-align: center; color: #e53e3e; padding: 20px; }
        @media (max-width: 768px) {
            .container { margin: 10px; border-radius: 15px; }
            .header, .content { padding: 20px; }
            .stats-grid { grid-template-columns: 1fr; }
            table { font-size: 13px; }
            th, td { padding: 12px 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>
                <i class="fas fa-tools"></i>
                安居家电 · 工程师管理
            </h2>
            <p>实时查看工程师擅长品类、服务区域与今日上门档期</p>
        </div>

        <div class="content">
            <div class="stats-grid">
                <div class="stat-card">
                    <i class="fas fa-users"></i>
                    <div class="number" id="statTotal">-</div>
                    <div class="label">工程师总数</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-user-check"></i>
                    <div class="number" id="statFree">-</div>
                    <div class="label">今日可接单</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-wrench"></i>
                    <div class="number" id="statBusy">-</div>
                    <div class="label">今日已排上门任务</div>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th><i class="fas fa-id-badge"></i> ID</th>
                            <th><i class="fas fa-user"></i> 姓名</th>
                            <th><i class="fas fa-wrench"></i> 擅长品类</th>
                            <th><i class="fas fa-map-marker-alt"></i> 服务区域</th>
                            <th><i class="fas fa-calendar-day"></i> 今日档期</th>
                        </tr>
                    </thead>
                    <tbody id="engineerRows">
                        <tr><td colspan="5" style="color:#999;">加载中...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="actions">
                <a href="/" class="nav-btn">
                    <i class="fas fa-home"></i> 返回客服主界面
                </a>
                <a href="/engineer_schedules" class="nav-btn secondary">
                    <i class="fas fa-calendar-alt"></i> 查看今日排班
                </a>
            </div>
        </div>
    </div>

    <script>
        async function loadEngineers() {
            try {
                const [engRes, schedRes] = await Promise.all([
                    fetch('/api/engineers'),
                    fetch('/api/engineers/schedules/today')
                ]);
                if (!engRes.ok || !schedRes.ok) throw new Error('接口请求失败');
                const engineers = await engRes.json();
                const schedules = await schedRes.json();

                // 按工程师分组今日忙碌时段
                const busyMap = {};
                schedules.forEach(item => {
                    if (item.busy_periods && item.busy_periods.length > 0) {
                        busyMap[item.engineer_id] = item.busy_periods;
                    }
                });

                let totalBusy = 0;
                const rows = engineers.map(eng => {
                    const busy = busyMap[eng.id] || [];
                    if (busy.length > 0) totalBusy++;

                    const skills = (eng.skills || '').split(/[、，,;；\/\s]+/).filter(s => s);
                    const skillHtml = skills.length > 0
                        ? skills.map(s => `<span class="skill-chip">${s}</span>`).join('')
                        : '<span style="color:#999;">综合维修</span>';

                    let statusHtml;
                    if (busy.length > 0) {
                        const times = busy.map(b => `${b.start}-${b.end}`).join('<br>');
                        statusHtml = `<div>
                            <span class="status-badge status-busy"><i class="fas fa-wrench"></i> 已排 ${busy.length} 单</span>
                            <div class="busy-list" style="margin-top:6px;">${times}</div>
                        </div>`;
                    } else {
                        statusHtml = `<span class="status-badge status-available"><i class="fas fa-check-circle"></i> 可接单</span>`;
                    }

                    return `<tr>
                        <td><strong>${eng.id}</strong></td>
                        <td>${eng.name}</td>
                        <td><div class="skill-chips">${skillHtml}</div></td>
                        <td><span class="region-badge">${eng.service_region || '全市'}</span></td>
                        <td>${statusHtml}</td>
                    </tr>`;
                }).join('');

                document.getElementById('statTotal').textContent = engineers.length;
                document.getElementById('statFree').textContent = engineers.length - totalBusy;
                document.getElementById('statBusy').textContent = totalBusy;
                document.getElementById('engineerRows').innerHTML = rows;
            } catch (error) {
                console.error('加载工程师数据失败:', error);
                document.getElementById('engineerRows').innerHTML =
                    `<tr><td colspan="5" class="load-error"><i class="fas fa-exclamation-triangle"></i> 加载失败：${error.message}，请确认服务已启动</td></tr>`;
                document.getElementById('statTotal').textContent = '-';
            }
        }
        loadEngineers();
    </script>
</body>
</html>
