<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安居家电 · 操作审计</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
            min-height: 100vh; padding: 20px;
        }
        .container {
            max-width: 1280px; margin: 0 auto; background: rgba(255,255,255,0.97);
            border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #4b5563 0%, #1f2937 100%);
            padding: 28px; color: white; text-align: center;
        }
        .header h2 { font-size: 26px; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .header p { font-size: 14px; opacity: 0.85; margin-top: 8px; }
        .content { padding: 26px; }
        .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
        .toolbar select {
            padding: 9px 14px; border: 2px solid rgba(0,0,0,0.1); border-radius: 10px;
            font-size: 14px; outline: none;
        }
        .toolbar select:focus { border-color: #6b7280; }
        .btn {
            padding: 10px 18px; border-radius: 10px; border: none; color: white;
            font-size: 14px; font-weight: 500; cursor: pointer;
            display: inline-flex; align-items: center; gap: 7px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15); transition: all 0.3s ease;
            text-decoration: none;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-dark { background: linear-gradient(135deg, #4b5563 0%, #1f2937 100%); }
        .btn-blue { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .btn-gray { background: linear-gradient(135deg, #8e8e93 0%, #636366 100%); }
        .table-container { background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: linear-gradient(135deg, #4b5563 0%, #374151 100%);
            color: white; padding: 13px 10px; font-weight: 600; font-size: 13px;
            text-align: left; white-space: nowrap;
        }
        td {
            padding: 11px 10px; border-bottom: 1px solid rgba(0,0,0,0.05);
            font-size: 13px; vertical-align: top;
        }
        tbody tr:hover { background: rgba(107,114,128,0.05); }
        .cell-detail { max-width: 320px; word-break: break-all; }
        .badge { padding: 3px 10px; border-radius: 14px; font-size: 12px; font-weight: 600; display: inline-block; white-space: nowrap; }
        .rk-read { background: rgba(39,174,96,0.15); color: #1e8449; }
        .rk-write { background: rgba(231,76,60,0.15); color: #c0392b; }
        .rk-confirm { background: rgba(243,156,18,0.2); color: #b9770e; }
        .res-ok { background: rgba(39,174,96,0.15); color: #1e8449; }
        .res-error { background: rgba(231,76,60,0.18); color: #c0392b; }
        .res-denied { background: rgba(243,156,18,0.2); color: #b9770e; }
        .empty-row td { padding: 30px; color: #999; text-align: center; }
        .actions { text-align: center; margin-top: 22px; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .nav-btn {
            padding: 12px 26px; border-radius: 25px; border: none; text-decoration: none; color: white;
            font-size: 14px; background: linear-gradient(135deg, #4b5563 0%, #374151 100%);
            display: inline-flex; align-items: center; gap: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2); transition: all 0.3s ease;
        }
        .nav-btn:hover { transform: translateY(-2px); }
        .nav-btn.home { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2><i class="fas fa-shield-alt"></i> 操作审计日志</h2>
            <p>全链路写操作留痕（主管工具选择 / 报修建单 / 派单流转 / 转人工登记 / 知识库变更 / AutoDream 沉淀）· 风险分级 + 幂等键治理可追溯</p>
        </div>
        <div class="content">
            <div class="toolbar">
                <select id="f-scene">
                    <option value="">全部场景</option>
                    <option value="supervisor">主管工具选择</option>
                    <option value="ticket_management">工单管理</option>
                    <option value="human_handover">转人工登记</option>
                    <option value="knowledge_management">知识库管理</option>
                    <option value="auto_dream">AutoDream 沉淀</option>
                </select>
                <select id="f-risk">
                    <option value="">全部风险</option>
                    <option value="read">read · 只读</option>
                    <option value="confirm">confirm · 关键操作</option>
                    <option value="write">write · 写库高危</option>
                </select>
                <select id="f-result">
                    <option value="">全部结果</option>
                    <option value="ok">ok · 成功</option>
                    <option value="error">error · 失败</option>
                </select>
                <button class="btn btn-blue" id="btn-refresh"><i class="fas fa-sync-alt"></i> 刷新</button>
                <span id="count-tip" style="color:#888; font-size:13px;"></span>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>操作方</th>
                            <th>场景</th>
                            <th>动作</th>
                            <th>对象</th>
                            <th>风险</th>
                            <th>结果</th>
                            <th>说明 / 来源 IP</th>
                        </tr>
                    </thead>
                    <tbody id="log-rows">
                        <tr class="empty-row"><td colspan="8">加载中...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="actions">
                <a href="/tickets" class="nav-btn"><i class="fas fa-wrench"></i> 工单管理</a>
                <a href="/" class="nav-btn home"><i class="fas fa-home"></i> 返回客服主界面</a>
            </div>
        </div>
    </div>

    <script>
        const SCENE_LABELS = {
            supervisor: '主管选择', ticket_management: '工单管理', human_handover: '转人工',
            knowledge_management: '知识库', auto_dream: 'AutoDream', ticket_service: '工单服务'
        };
        const ACTION_LABELS = {
            tool_select: '工具选择', create_ticket: '创建工单', assign_ticket: '派单',
            change_engineer: '更换工程师', update_status: '状态流转', create_handover: '转人工登记',
            add_knowledge: '新增知识', update_knowledge: '更新知识', delete_knowledge: '删除知识',
            consolidate: '偏好沉淀'
        };
        const RISK_LABELS = { read: '只读', confirm: '关键', write: '写库' };

        function $(id) { return document.getElementById(id); }

        async function loadLogs() {
            const scene = $('f-scene').value, risk = $('f-risk').value, result = $('f-result').value;
            const params = new URLSearchParams({ limit: '300' });
            if (scene) params.set('scene', scene);
            if (risk) params.set('risk_tier', risk);
            if (result) params.set('result', result);
            try {
                const resp = await fetch('/api/audit_logs?' + params.toString());
                const data = await resp.json();
                const rows = $('log-rows');
                const logs = data.logs || [];
                $('count-tip').textContent = '共 ' + data.total + ' 条记录';
                if (!logs.length) {
                    rows.innerHTML = '<tr class="empty-row"><td colspan="8">暂无审计记录（进行报修登记 / 后台派单 / 投诉转人工等操作后此处可查）</td></tr>';
                    return;
                }
                rows.innerHTML = logs.map(log => {
                    const riskCls = 'rk-' + (log.risk_tier || 'read');
                    const resCls = 'res-' + (log.result || 'ok');
                    const detail = (log.detail || '') + (log.ip ? ' · IP ' + log.ip : '');
                    const sceneLabel = SCENE_LABELS[log.scene] || log.scene || '-';
                    const actionLabel = ACTION_LABELS[log.action] || log.action || '-';
                    const resource = log.resource_id ? (log.resource_type || '') + ' ' + log.resource_id : '-';
                    return '<tr>' +
                        '<td style="white-space:nowrap;">' + (log.created_at || '-') + '</td>' +
                        '<td>' + (log.actor || '-') + '</td>' +
                        '<td>' + sceneLabel + '</td>' +
                        '<td>' + actionLabel + '</td>' +
                        '<td>' + resource + '</td>' +
                        '<td><span class="badge ' + riskCls + '">' + (RISK_LABELS[log.risk_tier] || log.risk_tier || '-') + '</span></td>' +
                        '<td><span class="badge ' + resCls + '">' + (log.result || '-') + '</span></td>' +
                        '<td class="cell-detail">' + (detail || '-') + '</td>' +
                        '</tr>';
                }).join('');
            } catch (e) {
                $('log-rows').innerHTML = '<tr class="empty-row"><td colspan="8">加载失败：' + e.message + '</td></tr>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadLogs();
            $('btn-refresh').addEventListener('click', loadLogs);
            ['f-scene', 'f-risk', 'f-result'].forEach(id => $(id).addEventListener('change', loadLogs));
        });
    </script>
</body>
</html>
